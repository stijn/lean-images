name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check the plugin version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ \* Version: *//p' lean-images.php)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "lean-images.php says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: lean-images
          path: lean-images.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" lean-images.zip --title "$GITHUB_REF_NAME" --generate-notes
